# Sanity config for AirSim backend (Phase 4 bringup).
# Mirrors configs/sanity.yaml but switches the simulator to Cosys-AirSim.
# Requires: AirSim running headlessly on the same machine (port 41451).
# Start it with: bash deploy/start_airsim.sh
backend: airsim
num_waypoints: 1
flight_dome_size: 5.0
waypoint_reach_distance: 3.0
wind_enabled: false
num_obstacles: 0
max_episode_steps: 300
agent_hz: 30
image_width: 64
image_height: 64
reward_shaping: 2.0
collision_penalty: 0.0
