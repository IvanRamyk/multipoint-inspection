# @package _global_
#
# FAST state-only chase experiment (iteration 4). Same DreamerV3-XS algo as
# drone_chase.yaml, but:
#   - NO cnn_keys: the env is run with observe_depth=false (state-only obs), so the
#     world model has no CNN encoder / image reconstruction — the dominant compute.
#   - mlp_keys = [state] only.
#   - num_envs raised (env step is cheap ~1 ms; more envs feed the GPU better).
# Pair with an env config that sets observe_depth:false (e.g. chase_pursuit_big.yaml).
# The camera drop + state-only world model is the main throughput lever; MEASURE
# sps in the first minutes of a run and compare to the ~1.5 sps image-based baseline.

defaults:
  - dreamer_v3
  - override /algo: dreamer_v3_S
  - override /env: drone_chase
  - override /model_manager: dreamer_v3
  - _self_

seed: 42

algo:
  replay_ratio: 1
  total_steps: 2000000
  learning_starts: 1000
  per_rank_batch_size: 16
  per_rank_sequence_length: 32
  cnn_keys:
    encoder: []
    decoder: []
  mlp_keys:
    encoder: [state]
    decoder: [state]

env:
  num_envs: 8

fabric:
  accelerator: cpu
  precision: 32

checkpoint:
  every: 10000

buffer:
  size: 100000
  checkpoint: true

distribution:
  type: "auto"

metric:
  log_every: 500
  aggregator:
    metrics:
      Loss/world_model_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/value_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/policy_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/observation_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/reward_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/state_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Loss/continue_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/kl:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/post_entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      State/prior_entropy:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/world_model:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/actor:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
      Grads/critic:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: ${metric.sync_on_compute}
